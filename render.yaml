databases:
  - name: kall-postgres
    databaseName: kall
    user: kall
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: kall-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /ready
    region: oregon
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: kall-postgres
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true
      - key: SENSITIVE_DATA_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        value: price_1U08lPIjMKrx5dSp2XBsn8to
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: kall-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    region: oregon
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
