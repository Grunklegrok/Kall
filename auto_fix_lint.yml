name: Auto Fix Lint

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0' # weekly at 03:00 UTC on Sundays (optional)

jobs:
  fix-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff --fix across repo
        id: ruff_fix
        run: |
          set -e
          ruff check --fix . || true
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push fixes
        if: steps.ruff_fix.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b auto/ruff-fixes
          git add -A
          git commit -m "chore: apply ruff fixes"
          git push --set-upstream origin auto/ruff-fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request with fixes
        if: steps.ruff_fix.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: apply ruff fixes"
          branch: auto/ruff-fixes
          title: "chore: apply automatic ruff fixes"
          body: |
            This PR contains automatic fixes applied by ruff --fix.
            Please review and merge to apply stylistic fixes across the repo.
          base: main
